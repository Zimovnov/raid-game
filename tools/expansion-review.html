<!doctype html><html lang="ru"><meta charset="utf-8"><title>RAID — проверка расширенных карт</title><style>body{margin:0;background:#17231e;color:#eee;font:13px monospace}canvas{width:100vw;height:100vh;display:block}aside{position:fixed;top:10px;left:10px;background:#101a16db;padding:12px;max-width:460px}button,select{padding:8px;margin:2px}pre{white-space:pre-wrap;font-size:10px;max-height:190px;overflow:auto}</style><canvas id="scene"></canvas><aside><select id="map"><option value="village">Дачный посёлок</option><option value="park">Сосновый парк</option><option value="factory">Завод</option><option value="city">Квартал</option><option value="mall">Торговый центр</option></select><button id="load">Загрузить карту</button><button id="district">Новый район</button><button id="forest">Лесная дорога</button><button id="walk">Пройти 10 секунд</button><button id="quality">Качество: высокое</button><button id="hide">Скрыть отчёт</button><button id="pause">Пауза</button><pre id="report">Нажмите «Загрузить карту». Производственные World и Babylon renderer; локальный тест.</pre></aside><script type="module">
import {Renderer} from '/src/rendering/renderer.ts';
import {World} from '/src/simulation/world.ts';
import {MAPS} from '/src/content/maps.ts';
import {newProfile} from '/src/domain/profile.ts';
import {noInput} from '/src/domain/util.ts';
const renderer=new Renderer(document.querySelector('canvas'),'babylon'), profile=newProfile({name:'Обход обновления',faction:'BEAR',face:0,outfit:0});
let world,actor,last=0,frames=0,costs=[],running=true,walkUntil=0,quality='high',errors=[],loadingMs=0;
window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const output=document.querySelector('#report');
document.querySelector('#load').onclick=()=>{const start=performance.now(),map=MAPS[document.querySelector('#map').value];renderer.setMap(map);world=new World(map,'expansion-browser',false,606);actor=world.addPlayer(profile.id,profile.character,profile.gear);costs=[];frames=0;loadingMs=performance.now()-start;running=true;last=performance.now();};
document.querySelector('#district').onclick=()=>{if(!world)return;const p=world.map.pois.find(p=>p.id==='district-0').p;actor.p=[p[0]+4,0,p[2]+21];actor.safePosition=[...actor.p];actor.yaw=0;actor.pitch=0;renderer.resetRaid();};
document.querySelector('#forest').onclick=()=>{if(!world)return;actor.p=[-world.map.size[0]*.3+43,0,-world.map.size[1]*.3+25];actor.safePosition=[...actor.p];actor.yaw=.8;actor.pitch=0;renderer.resetRaid();};
document.querySelector('#walk').onclick=()=>{walkUntil=performance.now()+10000;running=true;};
document.querySelector('#hide').onclick=()=>{output.hidden=!output.hidden;};
document.querySelector('#pause').onclick=()=>{running=!running;};
document.querySelector('#quality').onclick=e=>{quality=quality==='high'?'low':'high';e.target.textContent='Качество: '+(quality==='high'?'высокое':'низкое');};
function draw(now){requestAnimationFrame(draw);if(!world||!running)return;try{const start=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;const walking=now<walkUntil;world.input(actor.id,{...noInput(),seq:actor.input.seq+1,yaw:actor.yaw,pitch:actor.pitch,forward:walking?1:0});world.step(dt);const simMs=performance.now()-start;renderer.raid(world.snapshot(),actor.id,{yaw:actor.yaw,pitch:actor.pitch,fov:78,aim:false,bob:true,quality,dt});frames++;if(frames>30)costs.push(performance.now()-start);if(costs.length>240)costs.shift();if(frames%30===0){const sorted=[...costs].sort((a,b)=>a-b);output.textContent=JSON.stringify({map:world.map.id,frames,loadingMs:Math.round(loadingMs),simulationMs:simMs,cpuMedianMs:sorted[Math.floor(sorted.length*.5)],cpuP95Ms:sorted[Math.floor(sorted.length*.95)],size:world.map.size,position:actor.p.map(x=>+x.toFixed(2)),hp:actor.hp,bots:world.bots.length,weapons:[...new Set(world.bots.map(b=>b.weapon.def))],loot:world.containers.length,exits:world.map.exits.length,meshes:renderer.bridge.scene.meshes.length,materials:renderer.bridge.scene.materials.length,metrics:renderer.bridge.metrics,assetErrors:[...renderer.bridge.models.errors],errors},null,2);}}catch(e){errors.push(e.stack);output.textContent=JSON.stringify({errors},null,2);running=false;}}
requestAnimationFrame(draw);
</script></html>
