<!doctype html><html lang="ru"><meta charset="utf-8"><title>RAID GAME — оружие, полные сборки</title>
<style>body{margin:0;background:#c3c9c9;color:#192025;font:14px system-ui}canvas{width:1280px;height:720px;display:block}aside{position:absolute;left:14px;right:14px;top:12px;display:flex;gap:10px;padding:10px;background:#f2f3f0e8}select,button{font:inherit}footer{position:absolute;bottom:16px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:22px;margin:0}small{font-size:12px}body.clean aside{display:none}output{max-width:400px}#report{display:none}</style>
<canvas id="scene"></canvas><aside><select id="weapon" aria-label="Оружие"></select><select id="module" aria-label="Модуль"><option value="">Штатная сборка</option></select><select id="angle" aria-label="Ракурс"><option value="left">Слева</option><option value="right">Справа</option><option value="oblique">Три четверти</option><option value="top">Сверху</option><option value="front">Спереди</option><option value="rear">Сзади</option></select><button id="clean">Скрыть панель</button><a id="download" download="weapon.png">PNG кадр</a><output id="ready">Загрузка</output></aside><footer><div><h1 id="name"></h1><small id="caption">RAID GAME · полная штатная сборка · игровой рендерер, студийный свет</small></div><small id="viewName"></small></footer><pre id="report"></pre>
<script type="module">
import {Renderer} from '/src/rendering/renderer.ts';
import {weaponModel} from '/src/rendering/models.ts';
import {model,identity} from '/src/rendering/math.ts';
import {presentationBounds} from '/src/rendering/model-bounds.ts';
import {MODEL_ASSETS} from '/src/content/model-assets.ts';
import {CATALOG} from '/src/content/catalog.ts';
import {createWeapon,getSlots,moduleProblems,replacePreview} from '/src/domain/items.ts';
import {Vector3} from '@babylonjs/core/Maths/math.vector.js';
import {Color3} from '@babylonjs/core/Maths/math.color.js';
import {DirectionalLight} from '@babylonjs/core/Lights/directionalLight.js';
import {RawCubeTexture} from '@babylonjs/core/Materials/Textures/rawCubeTexture.js';
import {Constants} from '@babylonjs/core/Engines/constants.js';
const $=id=>document.getElementById(id),r=new Renderer($('scene'),'babylon'),b=r.bridge;
for(const mesh of b.scene.meshes)if(mesh.name==='daylight-sky')mesh.setEnabled(false);
const sky=b.scene.lights.find(l=>l.name==='sky');sky.intensity=1.2;sky.groundColor=new Color3(.55,.59,.62);
const fill=new DirectionalLight('studio-fill',new Vector3(-.7,-.2,.6),b.scene);fill.intensity=1.8;fill.diffuse=new Color3(.86,.92,1);
const rim=new DirectionalLight('studio-rim',new Vector3(.3,-.8,.9),b.scene);rim.intensity=2;rim.diffuse=new Color3(1,.97,.91);
const faces=Array.from({length:6},(_,face)=>{const data=new Uint8Array(32*32*4);for(let y=0;y<32;y++)for(let x=0;x<32;x++){const light=(face===2?.9:face===3?.32:.55+.35*Math.max(0,1-Math.abs(x-10)/7));const i=(y*32+x)*4;data[i]=Math.round(light*245);data[i+1]=Math.round(light*249);data[i+2]=Math.round(light*255);data[i+3]=255;}return data;});
b.scene.environmentTexture=new RawCubeTexture(b.scene,faces,32,Constants.TEXTUREFORMAT_RGBA,Constants.TEXTURETYPE_UNSIGNED_BYTE,true,false);b.scene.environmentIntensity=.8;
const weapons=Object.values(CATALOG).filter(d=>d.category==='weapon');$('weapon').innerHTML=weapons.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
let gun,parts,stable=0,previousSignature='';
function refresh(){gun=createWeapon($('weapon').value,false);$('module').innerHTML='<option value="">Штатная сборка</option>'+getSlots(gun).flatMap(s=>Object.values(CATALOG).filter(d=>d.category==='module'&&d.interface===s.slot.accepts&&!moduleProblems(gun,s.path,d.id).length).map(d=>`<option value="${s.path}|${d.id}">${s.slot.name}: ${d.name}</option>`)).join('');parts=weaponModel(gun);stable=0;}
$('weapon').onchange=refresh;$('module').onchange=()=>{gun=createWeapon($('weapon').value,false);if($('module').value){const [path,id]=$('module').value.split('|');gun=replacePreview(gun,path,id);}parts=weaponModel(gun);stable=0;};$('angle').onchange=()=>stable=0;$('clean').onclick=()=>document.body.classList.toggle('clean');refresh();
function draw(){
 const available=(id,group)=>b.models.hasGroup(id,group),bounds=presentationBounds(parts,available),center=bounds.min.map((v,i)=>(v+bounds.max[i])/2),extent=bounds.max.map((v,i)=>v-bounds.min[i]),angle=$('angle').value;
 const view={left:[Math.PI,.04],right:[0,.04],oblique:[2.7,.22],top:[0,Math.PI/2-.001],front:[-Math.PI/2,.02],rear:[Math.PI/2,.02]}[angle],aspect=b.canvas.clientWidth/b.canvas.clientHeight,projectedWidth=Math.abs(Math.sin(view[0]))*extent[0]+Math.abs(Math.cos(view[0]))*extent[2],projectedHeight=Math.abs(Math.cos(view[1]))*extent[1]+Math.abs(Math.sin(view[1]))*(Math.abs(Math.cos(view[0]))*extent[0]+Math.abs(Math.sin(view[0]))*extent[2]),radius=Math.max(projectedWidth/(2*Math.tan(43*Math.PI/360)*aspect),projectedHeight/(2*Math.tan(43*Math.PI/360)))*1.22+Math.max(...extent)*.15;
 const eye=[center[0]+Math.cos(view[0])*Math.cos(view[1])*radius,center[1]+Math.sin(view[1])*radius,center[2]+Math.sin(view[0])*Math.cos(view[1])*radius];
 b.begin(eye,center,43,[.67,.71,.72],'high');b.scene.fogEnabled=false;b.render([],parts.map(part=>({part,parent:identity()})),true);
 const bindings=parts.filter(p=>p.asset?.first).map(p=>({id:p.asset.weapon,group:p.asset.group,slot:p.slot||'body',ready:available(p.asset.weapon,p.asset.group),url:MODEL_ASSETS[p.asset.weapon].url})),ready=bindings.every(p=>p.ready),signature=JSON.stringify([gun.def,$('module').value,angle,ready]);stable=signature===previousSignature?stable+1:0;previousSignature=signature;
 const report={weapon:gun.def,name:CATALOG[gun.def].name,angle,installed:gun.children,ready,stableFrames:stable,bindings,metrics:b.metrics,errors:[...b.models.errors],bounds,scope:'Complete real weaponModel assembly through production Babylon bridge; studio lights only. Not gameplay acceptance.'};$('report').textContent=JSON.stringify(report);$('report').setAttribute('data-report',JSON.stringify(report));$('ready').textContent=ready&&stable>8?'ГОТОВО':`Загрузка ${bindings.filter(x=>x.ready).length}/${bindings.length}`;$('name').textContent=CATALOG[gun.def].name;$('caption').textContent='RAID GAME · '+($('module').value?'выбранная модификация':'штатная сборка')+' · игровой рендерер, студийный свет';$('viewName').textContent=$('angle').selectedOptions[0].textContent;if(ready&&stable===10){const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const ctx=canvas.getContext('2d');ctx.drawImage(b.canvas,0,0,1280,720);ctx.fillStyle='#1c2429';ctx.font='600 24px system-ui';ctx.fillText(CATALOG[gun.def].name,28,665);ctx.font='14px system-ui';ctx.fillText('RAID GAME · '+($('module').value?'выбранная модификация':'штатная сборка')+' · игровой рендерер, студийный свет',28,692);ctx.textAlign='right';ctx.fillText($('angle').selectedOptions[0].textContent,1250,692);$('download').href=canvas.toDataURL('image/png');$('download').download=gun.def+'-'+angle+'.png';}$('viewName').textContent=$('angle').selectedOptions[0].textContent;requestAnimationFrame(draw);
}requestAnimationFrame(draw);
</script></html>
