<!doctype html><html lang="ru"><meta charset="utf-8"><title>RAID 0.5.1 — длительный игровой прогон</title><style>body{margin:0;background:#111;color:white;font:14px monospace}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;top:10px;left:10px;background:#111d;padding:12px;max-width:700px}button{padding:12px}pre{white-space:pre-wrap}</style><canvas id="scene"></canvas><aside><button id="start">Начать 30 минут</button><pre id="report">Производственная симуляция и Babylon renderer. Автоматический ввод, локальный профиль; без сетевых утверждений.</pre></aside><script type="module">
import {Renderer} from '/src/rendering/renderer.ts';
import {World} from '/src/simulation/world.ts';
import {MAPS} from '/src/content/maps.ts';
import {newProfile} from '/src/domain/profile.ts';
import {createWeapon} from '/src/domain/items.ts';
import {ARSENAL_WEAPONS} from '/src/content/arsenal-expansion.ts';
const renderer=new Renderer(document.querySelector('canvas'),'babylon'), profile=newProfile({name:'Проверка',faction:'BEAR',face:0,outfit:0}), maps=Object.values(MAPS).filter(m=>m.id!=='range');
const report={status:'NOT RUN',scope:'30-minute browser-rendered production World with scripted movement, fire, aim, reload, bots and repeated map/weapon changes. Not human play or multiplayer browser acceptance.',seconds:0,raids:0,frames:0,samples:[],errors:[]};window.runtimeSoak={report};
let world,actor,started=0,last=0,accumulator=0,nextRaid=0,seq=0,costs=[];
function raid(){const m=maps[report.raids%maps.length];renderer.setMap(m);world=new World(m,'soak-'+report.raids,false,51+report.raids);const gear=structuredClone(profile.gear);gear.primary=createWeapon(ARSENAL_WEAPONS[report.raids%ARSENAL_WEAPONS.length].id);actor=world.addPlayer(profile.id,profile.character,gear);report.raids++;nextRaid=report.seconds+90;}
function draw(now){if(report.status!=='RUNNING')return;try{const dt=Math.min(.1,(now-last)/1000);last=now;report.seconds=(now-started)/1000;if(!world||report.seconds>=nextRaid||actor.status!=='active')raid();const start=performance.now();accumulator+=dt;while(accumulator>=1/30){const t=world.time;world.input(actor.id,{seq:++seq,forward:Math.sin(t/9)>.2?1:0,right:Math.sin(t/6)>.65?1:0,yaw:t/13,pitch:Math.sin(t/5)*.12,sprint:t%20<4,crouch:t%17<3,jump:t%12<.04,fire:t%5<.15,aim:t%10>5});if(world.tick%300===0)world.action(actor.id,{id:crypto.randomUUID(),type:'reload'});world.step();accumulator-=1/30;}const snapshot=world.snapshot();renderer.raid(snapshot,profile.id,{yaw:actor.yaw,pitch:actor.pitch,fov:78,aim:actor.input.aim,bob:true,quality:'high',dt});costs.push(performance.now()-start);report.frames++;if(!renderer.bridge.scene.meshes.length)throw Error('Scene did not render');if(!actor.p.every(Number.isFinite))throw Error('Non-finite actor position');if(renderer.bridge.models.errors.size)throw Error(JSON.stringify([...renderer.bridge.models.errors]));if(costs.length>=600){const sorted=costs.sort((a,b)=>a-b);report.samples.push({second:Math.round(report.seconds),map:world.map.id,cpuP95Ms:sorted[Math.floor(sorted.length*.95)],meshes:renderer.bridge.scene.meshes.length,materials:renderer.bridge.scene.materials.length,textures:renderer.bridge.scene.textures.length,heap:performance.memory?.usedJSHeapSize});costs=[];}if(report.seconds>=1800)report.status='PASSED';document.querySelector('#report').textContent=JSON.stringify({...report,samples:report.samples.slice(-2)},null,2);if(report.status==='RUNNING')requestAnimationFrame(draw);}catch(e){report.status='FAILED';report.errors.push(e.message);document.querySelector('#report').textContent=JSON.stringify(report,null,2);}}
document.querySelector('#start').onclick=()=>{if(report.status==='RUNNING')return;report.status='RUNNING';started=last=performance.now();document.querySelector('#start').disabled=true;requestAnimationFrame(draw);};
</script></html>
